name: ops-deploy-platform-cicd-v2

services:
  mysql-cicd:
    image: mysql:8.4@sha256:c831a0f11348d402b43d77453e17d770be2eef356615a2823fe0f5a0d6c8b9af
    environment:
      MYSQL_DATABASE: ops_deploy_cicd
      MYSQL_USER: ops_cicd
      MYSQL_PASSWORD: ${OPS_CICD_MYSQL_PASSWORD:-ops_cicd_local_password}
      MYSQL_ROOT_PASSWORD: ${OPS_CICD_MYSQL_ROOT_PASSWORD:-ops_cicd_local_root_password}
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:23306:3306"
    volumes:
      - cicd_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis-cicd:
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${OPS_CICD_REDIS_PASSWORD:-ops_cicd_local_redis_password}"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - cicd_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${OPS_CICD_REDIS_PASSWORD:-ops_cicd_local_redis_password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  cicd_mysql_data:
  cicd_redis_data:
