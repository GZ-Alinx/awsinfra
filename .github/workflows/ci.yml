name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go, Vue and Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Check frontend
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend test
          npm --prefix frontend run build
          npm --prefix frontend audit --registry=https://registry.npmjs.org --audit-level=high

      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal web)"

      - name: Test Go
        run: |
          go test -race ./...
          go vet ./...

      - name: Scan Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner .

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Validate infrastructure Terraform
        run: |
          terraform -chdir=terraform/infra init -backend=false -input=false
          terraform -chdir=terraform/infra validate

      - name: Validate platform Terraform
        run: |
          terraform -chdir=terraform/platform init -backend=false -input=false
          terraform -chdir=terraform/platform validate
