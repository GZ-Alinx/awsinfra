apiVersion: v1
kind: Pod
metadata:
  name: ops-deploy-runtime-migration
  namespace: ops-deploy-system
  labels:
    app.kubernetes.io/name: ops-deploy-runtime-migration
    app.kubernetes.io/part-of: ops-deploy-platform
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: migration
      image: busybox:1.37.0
      command: ["sh", "-ec", "trap 'exit 0' TERM INT; while true; do sleep 3600; done"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
          add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 256Mi
      volumeMounts:
        - name: runtime
          mountPath: /state
        - name: transfer
          mountPath: /transfer
  volumes:
    - name: runtime
      persistentVolumeClaim:
        claimName: ops-deploy-runtime
    - name: transfer
      emptyDir:
        sizeLimit: 256Mi
