environment_file: .env

server:
  listen_address: 127.0.0.1:8080
  read_timeout: 30s
  write_timeout: 120s
  # tls_cert_file: deploy/tls/server.crt
  # tls_key_file: deploy/tls/server.key

security:
  # The password itself is never stored in YAML. Generate an Argon2id hash with
  # `awsinfra hash-password` and export it through this environment variable.
  admin_username: admin
  password_hash_env: OPS_DEPLOY_PASSWORD_HASH
  # 32-byte base64 key used only to encrypt project AWS credentials in MySQL.
  credential_key_env: OPS_DEPLOY_CREDENTIAL_KEY
  session_ttl: 8h
  cookie_secure: false # Must be true for non-loopback/HTTPS access.
  # 仅用于敏感信息二次认证；普通平台登录不再按失败次数锁定。
  login_max_attempts: 5
  login_window: 15m
  login_lockout: 15m
  # Keep disabled to prevent Helm repository inspection from reaching internal services.
  allow_private_helm_repositories: false
  # Set to the browser-facing HTTPS origin when TLS terminates at an ALB/proxy.
  external_origin: ""

paths:
  repository_root: .
  environments_dir: environments
  data_dir: data
  terraform_infra_dir: terraform/infra
  terraform_platform_dir: terraform/platform
  etcd_chart_dir: terraform/platform/charts/etcd

tools:
  terraform: terraform
  aws: aws
  kubectl: kubectl
  helm: helm

aws:
  profile: ""

# Terraform state is never tied to the local machine or the platform PVC.
# The live central bucket and its encrypted credential are configured from
# Platform Management / Terraform State Center. The values below are retained
# only to discover and safely migrate the previous per-project S3 state layout.
terraform_state:
  enabled: true
  region: ap-south-1
  bucket_prefix: ops-tfstate
  key_prefix: ops-deploy
  auto_create: true

datastore:
  mysql:
    dsn_env: OPS_MYSQL_DSN
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_lifetime: 30m
  redis:
    address: 127.0.0.1:6379
    password_env: OPS_REDIS_PASSWORD
    database: 0
    key_prefix: ops:manager
    # Normal page loads use the last observed cluster snapshot. Refresh and
    # completed deployment jobs still force a live AWS/EKS collection.
    status_ttl: 10m
    job_state_ttl: 24h

jobs:
  max_parallel: 1
  timeout: 3h
  history_limit: 100

# The catalog drives the component editor and status page. Adding a component
# normally requires: Terraform/Helm implementation, one catalog entry, and an
# environments/*.yaml configuration block.
components:
  - key: vpc_cni
    hidden: true
    display_name: Amazon VPC CNI
    category: EKS Add-on
    description: Assigns VPC IP addresses to Kubernetes Pods.
    config_path: components.eks_addons.vpc_cni
    stage: platform
    status_type: eks_addon
    status_name: vpc-cni
