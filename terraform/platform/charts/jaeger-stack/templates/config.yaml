{{- $backend := lower .Values.storage.backend -}}
{{- if not (has $backend (list "badger" "elasticsearch")) -}}
{{- fail "storage.backend must be badger or elasticsearch" -}}
{{- end -}}
{{- if and (eq $backend "badger") (ne (int .Values.replicaCount) 1) -}}
{{- fail "Badger storage supports exactly one Jaeger replica; use Elasticsearch for cluster mode" -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jaeger-stack.name" . }}-config
  labels:
    {{- include "jaeger-stack.labels" . | nindent 4 }}
data:
  ui-config.json: |
    {
      "dependencies": {"menuEnabled": true, "dagMaxNumServices": 300},
      "monitor": {"menuEnabled": true},
      "themes": {"enabled": true},
      "criticalPathEnabled": true,
      "traceIdDisplayLength": 32,
      "tracking": {"gaID": "", "trackErrors": false}
    }
  jaeger.yaml: |
    service:
      extensions: [jaeger_storage, jaeger_query, healthcheckv2]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [jaeger_storage_exporter]
      telemetry:
        resource:
          service.name: jaeger
          deployment.environment.name: {{ .Values.environment | quote }}
          ops.project: {{ .Values.project | quote }}
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
        logs:
          level: info
    extensions:
      healthcheckv2:
        use_v2: true
        http:
          endpoint: 0.0.0.0:13133
      jaeger_query:
        storage:
          traces: trace_store
        ui:
          config_file: /etc/jaeger/ui-config.json
      jaeger_storage:
        backends:
          trace_store:
            {{- if eq $backend "badger" }}
            badger:
              directories:
                keys: /var/lib/jaeger/badger
                values: /var/lib/jaeger/badger
              ephemeral: false
              ttl:
                spans: {{ .Values.storage.retention | quote }}
              metrics_update_interval: 10s
            {{- else }}
            elasticsearch:
              server_urls:
                - ${env:ELASTICSEARCH_ENDPOINT}
              auth:
                basic:
                  username: ${env:ELASTICSEARCH_USERNAME}
                  password: ${env:ELASTICSEARCH_PASSWORD}
              indices:
                index_prefix: {{ .Values.storage.elasticsearch.indexPrefix | quote }}
                spans:
                  date_layout: "2006-01-02"
                  rollover_frequency: day
                  shards: {{ .Values.storage.elasticsearch.shards }}
                  replicas: {{ .Values.storage.elasticsearch.replicas }}
                services:
                  date_layout: "2006-01-02"
                  rollover_frequency: day
                  shards: {{ .Values.storage.elasticsearch.shards }}
                  replicas: {{ .Values.storage.elasticsearch.replicas }}
            {{- end }}
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        timeout: 5s
        send_batch_size: 1024
    exporters:
      jaeger_storage_exporter:
        trace_storage: trace_store
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jaeger-stack.name" . }}-proxy
  labels:
    {{- include "jaeger-stack.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      client_max_body_size 10m;
      {{- if .Values.basicAuth.enabled }}
      auth_basic "Jaeger Trace Console";
      auth_basic_user_file /etc/nginx/auth/.htpasswd;
      {{- end }}
      location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:16686;
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: jaeger-access
  labels:
    {{- include "jaeger-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.basicAuth.username | quote }}
  password: {{ .Values.basicAuth.password | quote }}
  {{- if eq $backend "elasticsearch" }}
  elasticsearch-username: {{ .Values.storage.elasticsearch.username | quote }}
  elasticsearch-password: {{ .Values.storage.elasticsearch.password | quote }}
  {{- end }}
