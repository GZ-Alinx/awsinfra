apiVersion: v1
kind: Service
metadata:
  name: {{ include "etcd.fullname" . }}-headless
  labels:
    {{- include "etcd.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "etcd.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: client
      port: 2379
      # A numeric target keeps the headless endpoint valid while members roll
      # between TLS and plaintext client listeners.
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: peer
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "etcd.fullname" . }}
  labels:
    {{- include "etcd.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "etcd.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: client
      port: 2379
      targetPort: {{ ternary "client" "client-plain" .Values.tls.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "etcd.fullname" . }}-client
  labels:
    {{- include "etcd.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "etcd.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: client
      port: 2379
      targetPort: {{ ternary "client" "client-plain" .Values.tls.enabled }}
