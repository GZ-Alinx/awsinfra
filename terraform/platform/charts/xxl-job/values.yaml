image:
  repository: xuxueli/xxl-job-admin
  tag: "3.4.2"
  pullPolicy: IfNotPresent

replicaCount: 1
nodeSelector: {}
tolerations: []

admin:
  username: admin
  password: ""

mysql:
  image: mysql:8.4
  password: ""
  storage: 8Gi
  storageClassName: gp3

