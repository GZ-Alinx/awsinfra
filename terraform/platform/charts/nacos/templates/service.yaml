apiVersion: v1
kind: Service
metadata:
  name: nacos-cs
  labels:
    {{- include "nacos.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "nacos.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: {{ .Values.service.apiPort }}
      targetPort: api
    - name: client-rpc
      port: {{ add .Values.service.apiPort 1000 }}
      targetPort: client-rpc
    - name: raft-rpc
      port: {{ add .Values.service.apiPort 1001 }}
      targetPort: raft-rpc
    - name: console
      port: {{ .Values.service.consolePort }}
      targetPort: console
    - name: mcp
      port: {{ .Values.service.mcpPort }}
      targetPort: mcp
