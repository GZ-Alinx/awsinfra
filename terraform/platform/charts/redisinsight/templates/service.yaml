apiVersion: v1
kind: Service
metadata:
  name: {{ include "redisinsight.fullname" . }}
  labels:
    {{- include "redisinsight.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "redisinsight.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: proxy
      protocol: TCP
