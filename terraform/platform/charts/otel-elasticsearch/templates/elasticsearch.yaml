apiVersion: v1
kind: Service
metadata:
  name: {{ include "otel-elasticsearch.name" . }}-headless
  labels:
    {{- include "otel-elasticsearch.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "otel-elasticsearch.selector" . | nindent 4 }}
  ports:
    - name: transport
      port: 9300
      targetPort: transport
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "otel-elasticsearch.name" . }}
  labels:
    {{- include "otel-elasticsearch.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "otel-elasticsearch.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "otel-elasticsearch.name" . }}
  labels:
    {{- include "otel-elasticsearch.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "otel-elasticsearch.name" . }}-headless
  replicas: {{ ternary .Values.replicas 1 (eq .Values.mode "cluster") }}
  podManagementPolicy: Parallel
  revisionHistoryLimit: 3
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ ternary "Retain" "Delete" .Values.storage.retainOnDelete }}
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "otel-elasticsearch.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "otel-elasticsearch.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq .Values.mode "cluster" }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "otel-elasticsearch.selector" . | nindent 20 }}
      {{- end }}
      containers:
        - name: elasticsearch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - eswrapper
            - -Ecluster.name={{ .Values.project }}-{{ .Values.environment }}-otel
            {{- if eq .Values.mode "cluster" }}
            - -Ediscovery.seed_hosts={{ include "otel-elasticsearch.name" . }}-headless
            - -Ecluster.initial_master_nodes={{- range $index := until (int .Values.replicas) }}{{ if $index }},{{ end }}{{ include "otel-elasticsearch.name" $ }}-{{ $index }}{{- end }}
            {{- else }}
            - -Ediscovery.type=single-node
            {{- end }}
            - -Expack.security.enabled=true
            - -Expack.security.http.ssl.enabled=false
            - -Expack.security.autoconfiguration.enabled=false
            - -Enode.store.allow_mmap=false
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: otel-elasticsearch-access
                  key: password
            - name: ES_JAVA_OPTS
              value: {{ .Values.javaOpts | quote }}
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - curl -fsS -u "elastic:${ELASTIC_PASSWORD}" "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - curl -fsS -u "elastic:${ELASTIC_PASSWORD}" "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "otel-elasticsearch.labels" . | nindent 10 }}
          ops-deploy.io/workload-kind: statefulset
          ops-deploy.io/workload-name: {{ include "otel-elasticsearch.name" . }}
          ops-deploy.io/volume-name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.storage.className | quote }}
        resources:
          requests:
            storage: {{ .Values.storage.initialSize | quote }}
{{- if eq .Values.mode "cluster" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "otel-elasticsearch.name" . }}
  labels:
    {{- include "otel-elasticsearch.labels" . | nindent 4 }}
spec:
  minAvailable: 2
  selector:
    matchLabels:
      {{- include "otel-elasticsearch.selector" . | nindent 6 }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "otel-elasticsearch.name" . }}
  labels:
    {{- include "otel-elasticsearch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "otel-elasticsearch.selector" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9200
        - protocol: TCP
          port: 9300
    {{- if .Values.allowedNamespaces }}
    - from:
        {{- range .Values.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        # Client namespaces need only the authenticated HTTP API. The native
        # transport port remains restricted to Elasticsearch peers in this
        # namespace.
        - protocol: TCP
          port: 9200
    {{- end }}
