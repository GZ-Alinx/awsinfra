apiVersion: apps/v1
kind: Deployment
metadata:
  name: efk-kibana
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "efk-stack.labels" . | nindent 4 }}
    ops-deploy.io/component: kibana
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "efk-stack.selector" "efk-kibana" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "efk-stack.selector" "efk-kibana" | nindent 8 }}
        ops-deploy.io/project: {{ .Values.project | quote }}
        ops-deploy.io/environment: {{ .Values.environment | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kibana
          image: {{ .Values.images.kibana | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVER_NAME
              value: {{ printf "%s-%s-logs" .Values.project .Values.environment | quote }}
            - name: SERVER_HOST
              value: 0.0.0.0
            - name: ELASTICSEARCH_HOSTS
              value: '["http://efk-elasticsearch.{{ .Values.namespace }}.svc.cluster.local:9200"]'
            - name: ELASTICSEARCH_USERNAME
              value: kibana_system
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: efk-stack-access
                  key: kibana-system-password
            - name: XPACK_SECURITY_ENCRYPTIONKEY
              valueFrom:
                secretKeyRef:
                  name: efk-stack-access
                  key: security-encryption-key
            - name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
              valueFrom:
                secretKeyRef:
                  name: efk-stack-access
                  key: saved-objects-encryption-key
            - name: XPACK_REPORTING_ENCRYPTIONKEY
              valueFrom:
                secretKeyRef:
                  name: efk-stack-access
                  key: reporting-encryption-key
            - name: TELEMETRY_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 5601
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.kibana.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: efk-kibana
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "efk-stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "efk-stack.selector" "efk-kibana" | nindent 4 }}
  ports:
    - name: http
      port: 5601
      targetPort: http
