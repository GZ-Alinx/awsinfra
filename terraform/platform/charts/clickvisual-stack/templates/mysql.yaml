{{- $namespace := .Values.namespace -}}
{{- $defaultClaim := "clickvisual-mysql-data" -}}
{{- $activeClaim := .Values.mysql.storage.activeClaim | default $defaultClaim -}}
{{- if eq $activeClaim $defaultClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $defaultClaim }}
  namespace: {{ $namespace }}
  {{- if .Values.storage.retainOnDelete }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "clickvisual-stack.labels" . | nindent 4 }}
    ops-deploy.io/component: mysql
    ops-deploy.io/workload-kind: statefulset
    ops-deploy.io/workload-name: clickvisual-mysql
    ops-deploy.io/volume-name: data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.mysql.storage.className | quote }}
  resources:
    requests:
      storage: {{ .Values.mysql.storage.size }}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickvisual-mysql
  namespace: {{ $namespace }}
  labels:
    {{- include "clickvisual-stack.labels" . | nindent 4 }}
    ops-deploy.io/component: mysql
spec:
  serviceName: clickvisual-mysql
  replicas: 1
  selector:
    matchLabels:
      {{- include "clickvisual-stack.selector" "mysql" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clickvisual-stack.selector" "mysql" | nindent 8 }}
        ops-deploy.io/project: {{ .Values.project | quote }}
        ops-deploy.io/environment: {{ .Values.environment | quote }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: {{ .Values.images.mysql | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_general_ci
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef: {name: clickvisual-mysql-auth, key: database}
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: {name: clickvisual-mysql-auth, key: username}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: clickvisual-mysql-auth, key: password}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: clickvisual-mysql-auth, key: password}
          ports:
            - name: mysql
              containerPort: 3306
          startupProbe:
            exec:
              command: [sh, -ec, "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -ec, "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -ec, "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $activeClaim }}
---
apiVersion: v1
kind: Service
metadata:
  name: clickvisual-mysql
  namespace: {{ $namespace }}
  labels:
    {{- include "clickvisual-stack.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "clickvisual-stack.selector" "mysql" | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickvisual-mysql
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "clickvisual-stack.selector" "mysql" | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "clickvisual-stack.selector" "clickvisual" | nindent 14 }}
      ports:
        - {protocol: TCP, port: 3306}
