{{- $root := . -}}
{{- $namespace := .Values.namespace -}}
{{- $replicas := int .Values.kafka.replicas -}}
{{- $voters := list -}}
{{- range $index := until $replicas -}}
{{- $voters = append $voters (printf "%d@clickvisual-kafka-%d.%s.svc.cluster.local:9093" (add $index 1) $index $namespace) -}}
{{- end -}}
{{- range $index := until $replicas }}
{{- $defaultClaim := printf "clickvisual-kafka-data-%d" $index -}}
{{- $activeClaim := include "clickvisual-stack.kafkaClaim" (list $root $index) -}}
{{- if eq $activeClaim $defaultClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $defaultClaim }}
  namespace: {{ $namespace }}
  {{- if $root.Values.storage.retainOnDelete }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "clickvisual-stack.labels" $root | nindent 4 }}
    ops-deploy.io/component: kafka
    ops-deploy.io/workload-kind: statefulset
    ops-deploy.io/workload-name: clickvisual-kafka-{{ $index }}
    ops-deploy.io/volume-name: data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $root.Values.kafka.storage.className | quote }}
  resources:
    requests:
      storage: {{ $root.Values.kafka.storage.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: clickvisual-kafka-{{ $index }}
  namespace: {{ $namespace }}
  labels:
    {{- include "clickvisual-stack.labels" $root | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    ops-deploy.io/stack: clickvisual
    ops-deploy.io/component: kafka
    ops-deploy.io/broker: {{ $index | quote }}
  ports:
    - {name: client, port: 9092, targetPort: client}
    - {name: controller, port: 9093, targetPort: controller}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickvisual-kafka-{{ $index }}
  namespace: {{ $namespace }}
  labels:
    {{- include "clickvisual-stack.labels" $root | nindent 4 }}
    ops-deploy.io/component: kafka
spec:
  serviceName: clickvisual-kafka-{{ $index }}
  replicas: 1
  selector:
    matchLabels:
      ops-deploy.io/stack: clickvisual
      ops-deploy.io/component: kafka
      ops-deploy.io/broker: {{ $index | quote }}
  template:
    metadata:
      labels:
        ops-deploy.io/stack: clickvisual
        ops-deploy.io/component: kafka
        ops-deploy.io/broker: {{ $index | quote }}
        ops-deploy.io/project: {{ $root.Values.project | quote }}
        ops-deploy.io/environment: {{ $root.Values.environment | quote }}
    spec:
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: {{ $root.Values.images.kafka | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: CLUSTER_ID, valueFrom: {secretKeyRef: {name: clickvisual-kafka-auth, key: cluster-id}}}
            - {name: KAFKA_NODE_ID, value: {{ add $index 1 | quote }}}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: {{ printf "PLAINTEXT://clickvisual-kafka-%d.%s.svc.cluster.local:9092" $index $namespace | quote }}}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: {{ join "," $voters | quote }}}
            # EBS filesystems create lost+found at the volume root. Kafka 4.x
            # rejects that directory as an invalid topic directory, so keep
            # broker data in a child directory that Kafka can create itself.
            - {name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data/kafka-logs"}
            - {name: KAFKA_NUM_PARTITIONS, value: {{ $root.Values.kafka.partitions | quote }}}
            - {name: KAFKA_LOG_RETENTION_HOURS, value: {{ $root.Values.kafka.retentionHours | quote }}}
            - {name: KAFKA_DEFAULT_REPLICATION_FACTOR, value: {{ min $replicas 3 | quote }}}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: {{ min $replicas 3 | quote }}}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: {{ min $replicas 3 | quote }}}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: {{ ternary 2 1 (ge $replicas 3) | quote }}}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
          ports:
            - {name: client, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          startupProbe:
            tcpSocket: {port: client}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: client}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: client}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml $root.Values.kafka.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $activeClaim }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: clickvisual-kafka
  namespace: {{ $namespace }}
  labels:
    {{- include "clickvisual-stack.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "clickvisual-stack.selector" "kafka" | nindent 4 }}
  ports:
    - {name: kafka, port: 9092, targetPort: client}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickvisual-kafka
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "clickvisual-stack.selector" "kafka" | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "clickvisual-stack.selector" "fluent-bit" | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "clickvisual-stack.selector" "clickhouse" | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "clickvisual-stack.selector" "kafka" | nindent 14 }}
      ports:
        - {protocol: TCP, port: 9092}
        - {protocol: TCP, port: 9093}
