project: project
environment: test

namespace: project-test-logs-system
nodeSelector: {}
tolerations: []

images:
  fluentBit: cr.fluentbit.io/fluent/fluent-bit:4.1.0
  kafka: apache/kafka:4.1.0
  clickhouse: clickhouse/clickhouse-server:26.3
  clickvisual: clickvisual/clickvisual:1.0.4@sha256:e11810796f15e8e7c47c9003c058356485b9d5fc71930313145a373c3658675e
  mysql: mysql:8.4
  proxy: nginxinc/nginx-unprivileged:1.29.5-alpine
  curl: curlimages/curl:8.17.0

secrets:
  mysqlPassword: ""
  clickhousePassword: ""
  adminPassword: ""
  proxyToken: ""
  secretKey: ""
  encryptionKey: ""
  kafkaClusterId: ""

collection:
  includeNamespaces: []
  excludeNamespaces: []
  includeServices: []
  excludeServices: []

kafka:
  replicas: 1
  partitions: 6
  retentionHours: 24
  storage:
    className: gp3
    size: 50Gi
    activeClaims: []
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 3Gi}

clickhouse:
  retentionDays: 7
  storage:
    className: gp3
    size: 100Gi
    activeClaim: ""
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "4", memory: 8Gi}

mysql:
  storage:
    className: gp3
    size: 20Gi
    activeClaim: ""
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}

clickvisual:
  rootURL: http://clickvisual
  username: admin
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}

storage:
  retainOnDelete: true
  shrinkSafetyPercent: 30
