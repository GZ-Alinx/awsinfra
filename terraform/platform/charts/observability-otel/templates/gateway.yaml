apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observability-otel.name" . }}-gateway
  labels:
    {{- include "observability-otel.labels" . | nindent 4 }}
    {{- include "observability-otel.gatewayLabels" . | nindent 4 }}
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      {{- if .Values.storage.enabled }}
      file_storage:
        directory: /var/lib/otelcol/storage
        create_directory: true
      {{- end }}
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: opentelemetry-gateway
              scrape_interval: 15s
              static_configs:
                - targets: ["127.0.0.1:8888"]
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource/platform:
        attributes:
          - {key: k8s.cluster.name, value: {{ .Values.clusterName | quote }}, action: upsert}
          - {key: deployment.environment.name, value: {{ .Values.environment | quote }}, action: upsert}
          - {key: ops.project, value: {{ .Values.project | quote }}, action: upsert}
      batch:
        timeout: 5s
        send_batch_size: 1024
    exporters:
      debug:
        verbosity: basic
      {{- if .Values.destinations.jaeger.enabled }}
      otlp/jaeger:
        endpoint: {{ .Values.destinations.jaeger.endpoint | quote }}
        tls:
          insecure: true
        sending_queue:
          enabled: true
          queue_size: {{ .Values.storage.queueSize }}
          {{- if .Values.storage.enabled }}
          storage: file_storage
          {{- end }}
      {{- end }}
      {{- if .Values.destinations.tempo.enabled }}
      otlp/tempo:
        endpoint: {{ .Values.destinations.tempo.endpoint | quote }}
        tls:
          insecure: true
        sending_queue:
          enabled: true
          queue_size: {{ .Values.storage.queueSize }}
          {{- if .Values.storage.enabled }}
          storage: file_storage
          {{- end }}
      {{- end }}
      {{- if .Values.destinations.prometheus.enabled }}
      prometheus:
        endpoint: 0.0.0.0:9464
        resource_to_telemetry_conversion:
          enabled: true
      {{- end }}
      {{- if .Values.destinations.loki.enabled }}
      otlphttp/loki:
        endpoint: {{ .Values.destinations.loki.endpoint | quote }}
        encoding: proto
        sending_queue:
          enabled: true
          queue_size: {{ .Values.storage.queueSize }}
          {{- if .Values.storage.enabled }}
          storage: file_storage
          {{- end }}
      {{- end }}
      {{- if .Values.destinations.elasticsearch.enabled }}
      elasticsearch:
        endpoints: [{{ .Values.destinations.elasticsearch.endpoint | quote }}]
        user: ${env:ELASTICSEARCH_USERNAME}
        password: ${env:ELASTICSEARCH_PASSWORD}
        logs_index: logs-otel
        sending_queue:
          enabled: true
          queue_size: {{ .Values.storage.queueSize }}
          {{- if .Values.storage.enabled }}
          storage: file_storage
          {{- end }}
      {{- end }}
    service:
      extensions:
        - health_check
        {{- if .Values.storage.enabled }}
        - file_storage
        {{- end }}
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource/platform, batch]
          exporters:
            {{- if .Values.destinations.jaeger.enabled }}
            - otlp/jaeger
            {{- end }}
            {{- if .Values.destinations.tempo.enabled }}
            - otlp/tempo
            {{- end }}
            {{- if and (not .Values.destinations.jaeger.enabled) (not .Values.destinations.tempo.enabled) }}
            - debug
            {{- end }}
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, resource/platform, batch]
          exporters:
            {{- if .Values.destinations.prometheus.enabled }}
            - prometheus
            {{- else }}
            - debug
            {{- end }}
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource/platform, batch]
          exporters:
            {{- if .Values.destinations.loki.enabled }}
            - otlphttp/loki
            {{- end }}
            {{- if .Values.destinations.elasticsearch.enabled }}
            - elasticsearch
            {{- end }}
            {{- if and (not .Values.destinations.loki.enabled) (not .Values.destinations.elasticsearch.enabled) }}
            - debug
            {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "observability-otel.name" . }}
  labels:
    {{- include "observability-otel.labels" . | nindent 4 }}
    {{- include "observability-otel.gatewayLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "observability-otel.name" . }}-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ ternary "Retain" "Delete" .Values.storage.retainOnDelete }}
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "observability-otel.gatewayLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "observability-otel.labels" . | nindent 8 }}
        {{- include "observability-otel.gatewayLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "observability-otel.name" . }}
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/otelcol-contrib"]
          args: ["--config=/conf/collector.yaml"]
          env:
            {{- if .Values.destinations.elasticsearch.enabled }}
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.destinations.elasticsearch.secretName }}
                  key: {{ .Values.destinations.elasticsearch.usernameKey }}
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.destinations.elasticsearch.secretName }}
                  key: {{ .Values.destinations.elasticsearch.passwordKey }}
            {{- end }}
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: health, containerPort: 13133}
            - {name: internal, containerPort: 8888}
            - {name: metrics, containerPort: 9464}
          readinessProbe:
            httpGet: {path: /, port: health}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: health}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: collector-storage, mountPath: /var/lib/otelcol/storage}
      volumes:
        - name: config
          configMap:
            name: {{ include "observability-otel.name" . }}-gateway
        - {name: tmp, emptyDir: {}}
        {{- if not .Values.storage.enabled }}
        - {name: collector-storage, emptyDir: {}}
        {{- end }}
  {{- if .Values.storage.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: collector-storage
        labels:
          {{- include "observability-otel.labels" . | nindent 10 }}
          ops-deploy.io/stack: opentelemetry
          ops-deploy.io/component: opentelemetry_collector
          ops-deploy.io/workload-kind: statefulset
          ops-deploy.io/workload-name: {{ include "observability-otel.name" . }}
          ops-deploy.io/volume-name: collector-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storage.className }}
        resources:
          requests:
            storage: {{ default .Values.storage.initialSize .Values.storage.expandedSize }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observability-otel.name" . }}-headless
  labels:
    {{- include "observability-otel.labels" . | nindent 4 }}
    {{- include "observability-otel.gatewayLabels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "observability-otel.gatewayLabels" . | nindent 4 }}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observability-otel.name" . }}
  labels:
    {{- include "observability-otel.labels" . | nindent 4 }}
    {{- include "observability-otel.gatewayLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "observability-otel.gatewayLabels" . | nindent 4 }}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc, appProtocol: grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http, appProtocol: http}
    - {name: internal, port: 8888, targetPort: internal}
    - {name: metrics, port: 9464, targetPort: metrics}
{{- if gt (int .Values.replicaCount) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "observability-otel.name" . }}
  labels:
    {{- include "observability-otel.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "observability-otel.gatewayLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "observability-otel.name" . }}
  labels:
    {{- include "observability-otel.labels" . | nindent 4 }}
    {{- toYaml .Values.serviceMonitor.labels | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "observability-otel.gatewayLabels" . | nindent 6 }}
  endpoints:
    - {port: internal, interval: 30s}
    - {port: metrics, interval: 30s}
{{- end }}
