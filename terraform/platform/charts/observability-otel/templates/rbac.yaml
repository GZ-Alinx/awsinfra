apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "observability-otel.name" . }}
  labels:
    {{- include "observability-otel.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "observability-otel.name" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "observability-otel.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events", "namespaces", "nodes", "nodes/metrics", "nodes/proxy", "pods", "pods/status", "services", "endpoints", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "observability-otel.name" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "observability-otel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "observability-otel.name" . }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "observability-otel.name" . }}
    namespace: {{ .Release.Namespace }}
