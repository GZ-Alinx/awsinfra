{{- $name := include "rabbitmq.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := default (randAlphaNum 32) .Values.auth.password -}}
{{- $cookie := default (randAlphaNum 48) .Values.auth.erlangCookie -}}
{{- if $existing }}
{{- $password = (index $existing.data "rabbitmq-password" | b64dec) -}}
{{- $cookie = (index $existing.data "rabbitmq-erlang-cookie" | b64dec) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
type: Opaque
stringData:
  rabbitmq-password: {{ $password | quote }}
  rabbitmq-erlang-cookie: {{ $cookie | quote }}
